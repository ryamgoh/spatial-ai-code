# GRPO on the SFT QLoRA, one h100-47.
# HF generate (no vLLM): QLoRA weight shapes cannot be load_weights()'d
# into a colocated vLLM Qwen3 engine.
# Prompts only; oracle_option is for rewards, not the model.
base_model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
load_in_4bit: true
adapter: qlora
lora_model_dir: ./outputs/deepseek-r1-qwen3-8b
lora_r: 64
lora_alpha: 128
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - down_proj
  - up_proj
# Required: Axolotl rejects fused LoRA kernels when rl: is set.
lora_qkv_kernel: false
lora_o_kernel: false
lora_mlp_kernel: false
embeddings_skip_upcast: true

rl: grpo
chat_template: qwen3
sample_packing: false
remove_unused_columns: false
skip_prepare_dataset: true

sequence_len: 1024
micro_batch_size: 4
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

learning_rate: 0.00001
optimizer: paged_adamw_8bit
lr_scheduler: cosine
warmup_ratio: 0.05
bf16: true
max_grad_norm: 1.0
num_epochs: 1
logging_steps: 1
save_steps: 10
save_total_limit: 3
auto_resume_from_checkpoints: true
eval_strategy: "no"

output_dir: ./outputs/deepseek-r1-qwen3-8b-grpo

datasets:
  - path: ../spatial_grpo_data.jsonl
    ds_type: json
    type:

trl:
  beta: 0.04
  epsilon: 0.2
  num_generations: 4
  max_completion_length: 1024
  temperature: 0.7
  use_vllm: false
  log_completions: true
  num_completions_to_print: 2
  mask_truncated_completions: true
  reward_funcs:
    - rewards.outcome_reward
    - rewards.format_reward
    - rewards.length_penalty
  reward_weights: [1.0, 0.1, 0.1]
