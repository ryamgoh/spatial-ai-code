[project]
name = "spatial-ai-finetune"
version = "0.1.0"
description = "Model finetuning with Axolotl"
requires-python = ">=3.11,<3.13"
dependencies = [
    "axolotl>=0.18.0,<0.19.0",
    "pyyaml>=6.0.3",
    "typer>=0.12",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    # ==0.28.0 required: 0.27.x loads qwen3_5_text configs but lacks the
    # "model.language_model." -> "model." weight-prefix mapper (vllm PR #50355),
    # which merged SFT checkpoints carry.
    "vllm==0.28.0",
]

[project.optional-dependencies]
vllm = [
    "axolotl[vllm]>=0.18.0,<0.19.0",
]

[tool.uv]
override-dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "mistral-common==1.11.5",
    "starlette>=1.0.1",         # Forces Gradio to look past its <1.0 constraint
    # vllm 0.28.0 needs huggingface-hub>=1.27.0; axolotl 0.18.0 pins 1.17.0.
    # Match the eval venv (resolves 1.29.0). hf-xet follows (axolotl pins 1.4.3).
    "huggingface-hub==1.29.0",
    "hf-xet==1.6.0",
    # torch 2.13 pulls nvidia-cudnn-cu13==9.20.0.48, which omits
    # libcudnn_engines_tensor_ir.so; Hopper SDPA then mixes with another
    # 9.x on the loader path → CUDNN_STATUS_SUBLIBRARY_VERSION_MISMATCH.
    # 9.23.2.1 ships that lib (pytorch/pytorch#187824).
    "nvidia-cudnn-cu13==9.23.2.1",
]
