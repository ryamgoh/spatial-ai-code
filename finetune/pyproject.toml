[project]
name = "spatial-ai-finetune"
version = "0.1.0"
description = "Model finetuning with Axolotl"
requires-python = ">=3.11,<3.13"
dependencies = [
    "axolotl>=0.18.0,<0.19.0",
    "pyyaml>=6.0.3",
    "typer>=0.12",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "vllm>=0.27.0",
]

[project.optional-dependencies]
vllm = [
    "axolotl[vllm]>=0.18.0,<0.19.0",
]

[tool.uv]
override-dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "mistral-common==1.11.5",
    "starlette>=1.0.1"          # Forces Gradio to look past its <1.0 constraint
]
