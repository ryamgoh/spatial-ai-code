# Cleaned SpatialMap TQA with empty-oracle rows dropped (1329).
# Same metrics as spatial_eval_gen_cleaned. Use for the 71/87 protocol.
task: spatial_eval_gen_cleaned_1329
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "../spatialeval_cleaned.jsonl"
test_split: test
output_type: generate_until

process_docs: !function utils.filter_nonempty_oracle

doc_to_text: |-
  {{text}}
doc_to_target: "{{oracle_option}}"

generation_kwargs:
  until: []

filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "Answer:\\s*([A-D](?:\\s*,\\s*[A-D])*)"
        group_select: -1

metric_list:
  - metric: !function utils.strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.loose_acc
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.1
  note: "Cleaned SpatialMap, 1329 rows with nonempty oracle_option"
