[project]
name = "spatial-ai-eval"
version = "0.1.0"
description = "Model evaluation with lm-eval"
requires-python = ">=3.11"
dependencies = [
    "lm-eval[vllm]>=0.4.7",
    "pyyaml>=6.0.3",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "llama-index>=0.12.42",
    "llama-index-embeddings-huggingface>=0.5.5",
    "outlines>=1.2.9",
    "typer>=0.12",
    "numpy>=1.24.0",
    "docx2txt>=0.9",
    # vLLM ==0.28.0 matches the finetune venv and is required for text-only
    # Qwen3.5 (qwen3_5_text) checkpoints: PR #50210 (config routing, 0.27.0)
    # plus PR #50355 (weight-prefix mapper for "model.language_model." keys,
    # 0.28.0). 0.17.0 only knew the multimodal class.
    "vllm==0.28.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
create_visual = "create_visual:main"

[tool.uv.sources]
lm-eval = { git = "https://github.com/EleutherAI/lm-evaluation-harness.git" }

[tool.uv]
override-dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    # Match the finetune venv (axolotl 0.18 pins transformers==5.14.1) so the
    # eval and train stacks stay coherent.
    "transformers==5.14.1",
]
