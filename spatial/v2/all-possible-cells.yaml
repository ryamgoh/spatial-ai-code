# SpatialEntail-ALL-POSSIBLE-Bench cell registry (draft, not frozen).
#
# Every cell is ALT: two or more answers are possible, and the model must return
# the complete possibility set under the ALL_POSSIBLE contract with a full menu.
# W<k> plants exactly k possible answers behind one Boolean rule; D<k> leaves an
# axis open along a k-link chain; NOISE adds irrelevant support-attached
# premises; JCR makes the planted memberships move together so intermediate
# counts are impossible. Direction menus show all eight directions so set size
# cannot be guessed from the menu; Selection and Count menus add at least three
# distractors.
version: 1
cells:
- id: DIR-MP-ALT-W2
  readiness: ready
  query_kind: direction
  capability_lenses:
  - LR
  - MTR
  reasoning_structures:
  - MP
  semantic_status: ALT
  evidence_obligations:
  - possibility-witness
  - candidate-exclusion
  generation:
    answer_mode: all-possible
    semantic_shape: ambiguous
    possibility_skeleton: mp
    possibility_width: 2
    num_entities: 10
    num_premises: 11
    ordinary_option_target: 8
