# SpatialEntail-ALL-POSSIBLE-Bench cell registry (draft, not frozen).
#
# Every cell is ALT: two or more answers are possible, and the model must return
# the complete possibility set under the ALL_POSSIBLE contract. Every menu shows
# exactly five options (ordinary_option_target: 5), so the number of options
# never reveals how many answers are correct and the task shape matches SINGLE
# and the external five-option benchmarks. G<k> plants exactly k possible answers
# (the gold set size, capped at four so the full set fits the five-option menu);
# D<k> leaves an axis open along a k-link chain; NOISE adds support-attached
# removable premises; JCR makes the planted memberships move together so
# intermediate counts are impossible.
version: 1
cells:
- id: DIR-MP-ALT-G2
  readiness: ready
  query_kind: direction
  capability_lenses:
  - LR
  - MTR
  reasoning_structures:
  - MP
  semantic_status: ALT
  evidence_obligations:
  - possibility-witness
  - candidate-exclusion
  generation:
    answer_mode: all-possible
    semantic_shape: ambiguous
    ordinary_option_target: 5
    possibility_skeleton: mp
    possibility_gold_size: 2
    num_entities: 10
    num_premises: 11
