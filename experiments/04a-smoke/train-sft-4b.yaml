# Exp 4a smoke — SFT QLoRA on Qwen3.5-4B (AxisDecomposition CoT traces).
# Same recipe as experiments/03-sft-vs-baseline/train-sft-8b.yaml, scaled to
# the 4B base. Sized for 1x H100-47 (MIG 3g.47gb). Adapter lands at
# experiments/04a-smoke/models/qwen3.5-4b-sft.
base_model: Qwen/Qwen3.5-4B
load_in_4bit: true
adapter: qlora
lora_r: 64
lora_alpha: 128
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - down_proj
  - up_proj
  # Gated DeltaNet linear-attention layers (hybrid arch — axolotl Qwen3.5 guide)
  - linear_attn.in_proj_qkv
  - linear_attn.in_proj_z
  - linear_attn.out_proj
lora_qkv_kernel: true
lora_o_kernel: true
lora_mlp_kernel: true
embeddings_skip_upcast: true
# sdpa (not the deprecated xformers_attention flag): axolotl's xformers
# attention patch calls transformers' _upad_input() without the new
# `unpad_input_func` arg required in transformers 5.14.1 -> TypeError.
# sdpa is torch-native, fast on H100, and works with QLoRA/packed layouts.
attn_implementation: sdpa
# Packing OFF: axolotl 0.18's Qwen3.5 packing patch (installed only when
# sample_packing is on) reads decoder-layer attribute `layer_type`, but
# transformers 5.14.1 names it `block_type` -> AttributeError at step 0.
# Without packing the standard forward runs unpatched. Cost: ~1.5-2x slower
# (samples are small: median ~1.9K, max ~3.7K tokens).
sample_packing: false
# Cap at the data, not 16k: padding/activation at 16384 OOMs a 47GB slice.
pad_to_sequence_len: false
learning_rate: 0.0001
sequence_len: 4096
micro_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optimizer: paged_adamw_8bit
lr_scheduler: cosine
warmup_ratio: 0.05
fp16: false
bf16: true
max_grad_norm: 0.05
num_epochs: 2
logging_steps: 1
output_dir: ../experiments/04a-smoke/models/qwen3.5-4b-sft
datasets:
  - path: ../data/spatial_sft_data_all_train.jsonl
    type: chat_template
    field_messages: messages
dataloader_prefetch_factor: 8
dataloader_num_workers: 2
dataloader_pin_memory: true

# Validation split + early stopping (same strategy as the 8B SFT run)
val_set_size: 0.05
eval_strategy: steps
eval_steps: 10
save_steps: 10
load_best_model_at_end: true
early_stopping_patience: 1
early_stopping_threshold: 0.05
metric_for_best_model: eval_loss
greater_is_better: false
