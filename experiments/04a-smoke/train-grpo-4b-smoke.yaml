# Exp 4a smoke — GRPO (20 steps) on the merged Qwen3.5-4B SFT weights.
# 2-GPU vLLM server + trainer, sized for 2x H100-47 (MIG 3g.47gb).
# Smoke scale: ~300 prompts, 20 steps.
# Requires: models/qwen3.5-4b-sft-merged (created by merge_sft.py in the
# batch launcher) and ../spatial_grpo_data_smoke4a.jsonl (generated in-job).
base_model: ../experiments/04a-smoke/models/qwen3.5-4b-sft-merged
load_in_4bit: false
adapter: lora
lora_r: 64
lora_alpha: 128
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - down_proj
  - up_proj
  # Gated DeltaNet linear-attention layers (hybrid arch — axolotl Qwen3.5 guide)
  - linear_attn.in_proj_qkv
  - linear_attn.in_proj_z
  - linear_attn.out_proj
lora_qkv_kernel: false
lora_o_kernel: false
lora_mlp_kernel: false

rl: grpo
attn_implementation: sdpa
# qwen3_5 to match what SFT infers for Qwen3.5 (renders identically for text,
# but keeps train/eval prompt formatting consistent).
chat_template: qwen3_5
sample_packing: false
remove_unused_columns: false
skip_prepare_dataset: true

sequence_len: 1024
# Must be divisible by num_generations. 8 = 2 prompts x G=4 (16 is the
# 96GB setting; 8B-on-47 used 4).
micro_batch_size: 8
gradient_accumulation_steps: 1
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

learning_rate: 0.00001
optimizer: adamw_torch
lr_scheduler: cosine
warmup_steps: 5
bf16: true
max_grad_norm: 1.0
num_epochs: 1
max_steps: 20
logging_steps: 1
save_steps: 10
save_total_limit: 2
auto_resume_from_checkpoints: false
eval_strategy: "no"
val_set_size: 0.0
load_best_model_at_end: false

output_dir: ../experiments/04a-smoke/models/qwen3.5-4b-grpo-smoke

datasets:
  - path: ../spatial_grpo_data_smoke4a.jsonl
    ds_type: json
    type:

trl:
  beta: 0.04
  epsilon: 0.2
  num_generations: 4
  max_completion_length: 1536
  temperature: 0.7
  use_vllm: true
  vllm_mode: server
  vllm_lora_sync: true
  vllm_server_host: 127.0.0.1
  vllm_server_port: 8000
  vllm_server_timeout: 600
  log_completions: true
  num_completions_to_print: 2
  mask_truncated_completions: true
  reward_funcs:
    - rewards.outcome_reward
    - rewards.format_reward
    - rewards.length_penalty
  reward_weights: [1.0, 0.1, 0.1]

vllm:
  host: 0.0.0.0
  port: 8000
  tensor_parallel_size: 1
  # 0.80 * 47GB ≈ 38GB for 4B bf16 + LoRA + 3072-token KV. Do not raise
  # max_model_len (native context is 262144 and the KV would OOM).
  gpu_memory_utilization: 0.80
  dtype: auto
  max_model_len: 3072
