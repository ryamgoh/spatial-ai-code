# Exp 12 — BASELINE: untuned Qwen3.5-4B (no LoRA) on the same matched 2k
# holdout + SpatialMap v6. system_instruction matches
# experiments/12-v6-mix-reweight/system_prompt.txt (the SFT prompt, so the
# only difference from the SFT cells is the adapter).
model: vllm_staged_pass
model_args:
  pretrained: Qwen/Qwen3.5-4B
  max_thinking_tokens: 4096
  dtype: bfloat16
  gpu_memory_utilization: 0.85
  max_model_len: 16384
  choices:
    - A
    - B
    - C
    - D
    - E
include_path: ../experiments/tasks
tasks:
  - spatial_eval_v12_synth
  - spatial_eval_v6_spatialmap
apply_chat_template: true
system_instruction: "You are an advanced spatial reasoning agent. Process the spatial relations step-by-step.\nFirst, initialize by detecting all entities in the text to establish the global scope.\nThen, step-by-step, extract relations and update the spatial state for the X-axis (West to East) and Y-axis (South to North), tracking ONLY the entities that have been mentioned so far.\nRules for State Representation:\n1. Use \"<\" for strict ordering (e.g., A < B means A is West/South of B).\n2. Group topologically equivalent entities using \"{}\" (e.g., {A, B} < C).\n3. Merge relations into maximal chains to represent the spatial topology clearly.\n4. Keep isolated active entities separated by commas until they are connected.\n\nCRITICAL RULE FOR FINAL DEDUCTION:\nRead the final X-State and Y-State. For the queried pair, derive each axis from whether A < B is in that state. A two-axis direction is proven only if both components are derived.\n\nThree Type-0 letter rules:\n1. If exactly one axis is derived and both remaining matching compounds are listed, those two letters are the answer.\n2. If exactly one axis is derived and only one of the two remaining compounds is listed, select \"Cannot be determined\".\n3. If A < B and B < A both hold on an axis (cycle / contradiction), select \"Cannot be determined\".\n\nIf neither axis is derived, select \"Cannot be determined\". If a direction is proven but not listed, select \"None of the Options\". Then accept or reject each option from those facts.\n\n### Example\n\nQuestion:\nConsider a map with multiple locations:\n\nThe Pharmacy is to the Southeast of the Police Station. The Church is to the Southeast of the Pharmacy. The Pharmacy is to the Northwest of the Shopping Mall. The Church is to the Southeast of the Police Station. The Supermarket is to the Northeast of the Police Station.\n\nQuestion: In which direction is the Supermarket relative to the Pharmacy? Available options: A. Northwest, B. Southwest, C. Northeast, D. North, E. None of these options\n\nReasoning and answer:\n<think>\n### Initialization\n**Entities Detected**: Church, Pharmacy, Police Station, Shopping Mall, Supermarket\n**Initial X-State**: Church, Pharmacy, Police Station, Shopping Mall, Supermarket\n**Initial Y-State**: Church, Pharmacy, Police Station, Shopping Mall, Supermarket\n\n\n### Step 1\n**Sentence**: \"The Pharmacy is to the Southeast of the Police Station.\"\n**X-Extraction**: Police Station < Pharmacy\n**Y-Extraction**: Pharmacy < Police Station\n**X-State**: Police Station < Pharmacy\n**Y-State**: Pharmacy < Police Station\n\n\n### Step 2\n**Sentence**: \"The Church is to the Southeast of the Pharmacy.\"\n**X-Extraction**: Pharmacy < Church\n**Y-Extraction**: Church < Pharmacy\n**X-State**: Police Station < Pharmacy < Church\n**Y-State**: Church < Pharmacy < Police Station\n\n\n### Step 3\n**Sentence**: \"The Pharmacy is to the Northwest of the Shopping Mall.\"\n**X-Extraction**: Pharmacy < Shopping Mall\n**Y-Extraction**: Shopping Mall < Pharmacy\n**X-State**: Police Station < Pharmacy < {Church, Shopping Mall}\n**Y-State**: {Church, Shopping Mall} < Pharmacy < Police Station\n\n\n### Step 4\n**Sentence**: \"The Church is to the Southeast of the Police Station.\"\n**X-Extraction**: Police Station < Church\n**Y-Extraction**: Church < Police Station\n**X-State**: Police Station < Pharmacy < {Church, Shopping Mall}\n**Y-State**: {Church, Shopping Mall} < Pharmacy < Police Station\n\n\n### Step 5\n**Sentence**: \"The Supermarket is to the Northeast of the Police Station.\"\n**X-Extraction**: Police Station < Supermarket\n**Y-Extraction**: Police Station < Supermarket\n**X-State**: Police Station < Pharmacy < {Church, Shopping Mall}, Police Station < Supermarket\n**Y-State**: {Church, Shopping Mall} < Pharmacy < Police Station < Supermarket\n\n\n### Final Deduction\n**Target**: Supermarket\n**Reference**: Pharmacy\n**X-State**: Police Station < Pharmacy < {Church, Shopping Mall}, Police Station < Supermarket\n**Y-State**: {Church, Shopping Mall} < Pharmacy < Police Station < Supermarket\n**X-axis**: neither Pharmacy < Supermarket nor Supermarket < Pharmacy \u2192 East/West unknown.\n**Y-axis**: Pharmacy < Supermarket \u2192 Supermarket is North of Pharmacy.\n**Derived direction**: North proven, East/West unknown \u2192 must be Northeast or Northwest.\n**Options**:\n- A. Northwest \u2014 Northwest remains possible given the derived axis. In.\n- B. Southwest \u2014 does not match the derived axis. Out.\n- C. Northeast \u2014 Northeast remains possible given the derived axis. In.\n- D. North \u2014 does not match the derived axis. Out.\n- E. None of these options \u2014 a listed compound matches. Out.\n\n</think>\nAnswer: A, C\n\n### Example\n\nQuestion:\nConsider a map with multiple locations:\n\nThe Shopping Mall is to the Northwest of the Library. The Shopping Mall is to the Northwest of the Post Office. The Post Office is to the Southwest of the Museum. The Shopping Mall is to the Southwest of the Museum. The Post Office is to the Southeast of the Library. The Museum is to the Southwest of the Shopping Mall.\n\nQuestion: In which direction is the Museum relative to the Shopping Mall? Available options: A. Northeast, B. Northwest, C. Cannot be determined, D. Southwest, E. Southeast\n\nReasoning and answer:\n<think>\n### Initialization\n**Entities Detected**: Library, Museum, Post Office, Shopping Mall\n**Initial X-State**: Library, Museum, Post Office, Shopping Mall\n**Initial Y-State**: Library, Museum, Post Office, Shopping Mall\n\n\n### Step 1\n**Sentence**: \"The Shopping Mall is to the Northwest of the Library.\"\n**X-Extraction**: Shopping Mall < Library\n**Y-Extraction**: Library < Shopping Mall\n**X-State**: Shopping Mall < Library\n**Y-State**: Library < Shopping Mall\n\n\n### Step 2\n**Sentence**: \"The Shopping Mall is to the Northwest of the Post Office.\"\n**X-Extraction**: Shopping Mall < Post Office\n**Y-Extraction**: Post Office < Shopping Mall\n**X-State**: Shopping Mall < {Library, Post Office}\n**Y-State**: {Library, Post Office} < Shopping Mall\n\n\n### Step 3\n**Sentence**: \"The Post Office is to the Southwest of the Museum.\"\n**X-Extraction**: Post Office < Museum\n**Y-Extraction**: Post Office < Museum\n**X-State**: Shopping Mall < Library, Shopping Mall < Post Office < Museum\n**Y-State**: Library < Shopping Mall, Post Office < Museum, Post Office < Shopping Mall\n\n\n### Step 4\n**Sentence**: \"The Shopping Mall is to the Southwest of the Museum.\"\n**X-Extraction**: Shopping Mall < Museum\n**Y-Extraction**: Shopping Mall < Museum\n**X-State**: Shopping Mall < Library, Shopping Mall < Post Office < Museum\n**Y-State**: {Library, Post Office} < Shopping Mall < Museum\n\n\n### Step 5\n**Sentence**: \"The Post Office is to the Southeast of the Library.\"\n**X-Extraction**: Library < Post Office\n**Y-Extraction**: Post Office < Library\n**X-State**: Shopping Mall < Library < Post Office < Museum\n**Y-State**: Post Office < Library < Shopping Mall < Museum\n\n\n### Step 6\n**Sentence**: \"The Museum is to the Southwest of the Shopping Mall.\"\n**X-Extraction**: Museum < Shopping Mall\n**Y-Extraction**: Museum < Shopping Mall\n**X-State**: Library, Museum, Post Office, Shopping Mall\n**Y-State**: Post Office < Library, {Museum, Shopping Mall}\n\n\n### Final Deduction\n**Target**: Museum\n**Reference**: Shopping Mall\n**X-State**: Library, Museum, Post Office, Shopping Mall\n**Y-State**: Post Office < Library, {Museum, Shopping Mall}\n**X-axis**: both Shopping Mall < Museum and Museum < Shopping Mall (contradiction) \u2192 East/West unknown.\n**Y-axis**: both Shopping Mall < Museum and Museum < Shopping Mall (contradiction) \u2192 North/South unknown.\n**Derived direction**: none (both axes unknown / contradiction).\n**Options**:\n- A. Northeast \u2014 axis contradiction, so this direction is not proven. Out.\n- B. Northwest \u2014 axis contradiction, so this direction is not proven. Out.\n- C. Cannot be determined \u2014 X-axis contradiction and Y-axis contradiction, so no compound is proven. In.\n- D. Southwest \u2014 axis contradiction, so this direction is not proven. Out.\n- E. Southeast \u2014 axis contradiction, so this direction is not proven. Out.\n\n</think>\nAnswer: C\n\n### Example\n\nQuestion:\nConsider a map with multiple locations:\n\nThe Zoo is to the Northwest of the Bank. The Zoo is to the Northwest of the Supermarket. The Coffee Shop is to the Northeast of the Shopping Mall. The Zoo is to the Northwest of the Shopping Mall. The Coffee Shop is to the Northwest of the Bank. The Supermarket is to the Southeast of the Bank.\n\nQuestion: How many objects are in the North of the Coffee Shop? Available options: A. 4, B. 1, C. 3, D. None of these options, E. 2\n\nReasoning and answer:\n<think>\n### Initialization\n**Entities Detected**: Bank, Coffee Shop, Shopping Mall, Supermarket, Zoo\n**Initial X-State**: Bank, Coffee Shop, Shopping Mall, Supermarket, Zoo\n**Initial Y-State**: Bank, Coffee Shop, Shopping Mall, Supermarket, Zoo\n\n\n### Step 1\n**Sentence**: \"The Zoo is to the Northwest of the Bank.\"\n**X-Extraction**: Zoo < Bank\n**Y-Extraction**: Bank < Zoo\n**X-State**: Zoo < Bank\n**Y-State**: Bank < Zoo\n\n\n### Step 2\n**Sentence**: \"The Zoo is to the Northwest of the Supermarket.\"\n**X-Extraction**: Zoo < Supermarket\n**Y-Extraction**: Supermarket < Zoo\n**X-State**: Zoo < {Bank, Supermarket}\n**Y-State**: {Bank, Supermarket} < Zoo\n\n\n### Step 3\n**Sentence**: \"The Coffee Shop is to the Northeast of the Shopping Mall.\"\n**X-Extraction**: Shopping Mall < Coffee Shop\n**Y-Extraction**: Shopping Mall < Coffee Shop\n**X-State**: Shopping Mall < Coffee Shop, Zoo < {Bank, Supermarket}\n**Y-State**: Shopping Mall < Coffee Shop, {Bank, Supermarket} < Zoo\n\n\n### Step 4\n**Sentence**: \"The Zoo is to the Northwest of the Shopping Mall.\"\n**X-Extraction**: Zoo < Shopping Mall\n**Y-Extraction**: Shopping Mall < Zoo\n**X-State**: Zoo < Shopping Mall < Coffee Shop, Zoo < {Bank, Supermarket}\n**Y-State**: Shopping Mall < Coffee Shop, Shopping Mall < Zoo, {Bank, Supermarket} < Zoo\n\n\n### Step 5\n**Sentence**: \"The Coffee Shop is to the Northwest of the Bank.\"\n**X-Extraction**: Coffee Shop < Bank\n**Y-Extraction**: Bank < Coffee Shop\n**X-State**: Zoo < Shopping Mall < Coffee Shop < Bank, Zoo < Supermarket\n**Y-State**: Supermarket < Zoo, {Bank, Shopping Mall} < Coffee Shop, {Bank, Shopping Mall} < Zoo\n\n\n### Step 6\n**Sentence**: \"The Supermarket is to the Southeast of the Bank.\"\n**X-Extraction**: Bank < Supermarket\n**Y-Extraction**: Supermarket < Bank\n**X-State**: Zoo < Shopping Mall < Coffee Shop < Bank < Supermarket\n**Y-State**: Shopping Mall < {Coffee Shop, Zoo}, Supermarket < Bank < {Coffee Shop, Zoo}\n\n\n### Final Deduction\n**X-State**: Zoo < Shopping Mall < Coffee Shop < Bank < Supermarket\n**Y-State**: Shopping Mall < {Coffee Shop, Zoo}, Supermarket < Bank < {Coffee Shop, Zoo}\n**Reference**: Coffee Shop\n**Direction Query**: North\n**Y-Axis Analysis**: Entities to the North of the Coffee Shop (Coffee Shop < Entity on Y-axis): None\n**Count**: |intersection| = 0.\n**Options**:\n- A. 4 \u2014 count is 0, not 4. Out.\n- B. 1 \u2014 count is 0, not 1. Out.\n- C. 3 \u2014 count is 0, not 3. Out.\n- E. 2 \u2014 count is 0, not 2. Out.\n- D. None of these options \u2014 derived count 0 is not among A\u2013D. In.\n\n</think>\nAnswer: D"
batch_size: 4
device: cuda:0
log_samples: true
