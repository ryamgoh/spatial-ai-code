# V13.1 evaluation-only structural breakpoint suite. Never an SFT split.
task: spatial_eval_v13_breakpoint
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "../data/spatial_v13_breakpoint_test.jsonl"
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_v13_sft
doc_to_text: "{{text}}"
doc_to_target: "{{oracle_option}}"
generation_kwargs:
  until: []
filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "Answer:\\s*([A-E](?:\\s*,\\s*[A-E])*)"
        group_select: -1
metric_list:
  - metric: !function utils.strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.loose_acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  note: "V13.1 breakpoint: depth 6/8/10, heavy interference, unequal axes, and matched long loops/open chains"
