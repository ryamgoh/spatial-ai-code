# Exp 12 — dir-2 / dir-incomplete / dir-cycle slice of the matched 2k holdout.
task: spatial_eval_v12_hard
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "../data/spatial_sft_v12_hard_eval.jsonl"
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_v6_sft
doc_to_text: "{{text}}"
doc_to_target: "{{oracle_option}}"
generation_kwargs:
  until: []
filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "Answer:\\s*([A-E](?:\\s*,\\s*[A-E])*)"
        group_select: -1
metric_list:
  - metric: !function utils.strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.loose_acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  note: "Hard Type-0 buckets from the Exp 12 2k holdout; checkpoint pick metric"
