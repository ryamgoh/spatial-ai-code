# Exp 11 — SpatialMap TQA with v6 gold + fifth option (clean_v6 / SpatialSolver).
task: spatial_eval_v6_spatialmap
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "../data/spatialeval_v6_corr.jsonl"
test_split: test
output_type: generate_until
process_docs: !function utils.filter_v6_spatialmap
doc_to_text: "{{text}}"
doc_to_target: "{{oracle_option}}"
generation_kwargs:
  until: []
filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "Answer:\\s*([A-E](?:\\s*,\\s*[A-E])*)"
        group_select: -1
metric_list:
  - metric: !function utils.strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.loose_acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  note: "SpatialMap-TQA 1500 with v6 fifth option and SpatialSolver gold"
