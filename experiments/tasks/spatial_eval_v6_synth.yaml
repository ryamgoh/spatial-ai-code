# Exp 11 — held-out synthetic 20% test (generate_all_v6, seed 43).
task: spatial_eval_v6_synth
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "../data/spatial_sft_v6_scale_test.jsonl"
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_v6_sft
doc_to_text: "{{text}}"
doc_to_target: "{{oracle_option}}"
generation_kwargs:
  until: []
filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "Answer:\\s*([A-E](?:\\s*,\\s*[A-E])*)"
        group_select: -1
metric_list:
  - metric: !function utils.strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.loose_acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  note: "generate_all_v6 synthetic test split (~4k, 20% of 20k train)"
