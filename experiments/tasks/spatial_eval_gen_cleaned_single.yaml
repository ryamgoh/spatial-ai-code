# SpatialMap-TQA-Corr-Single: same jsonl as TQA-Corr; keep rows whose gold
# is exactly one A–D letter.
# 1038 of 1329 nonempty-oracle rows: count 404, dir 332, which 302.
task: spatial_eval_gen_cleaned_single
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "../data/spatialeval_cleaned.jsonl"
test_split: test
output_type: generate_until

process_docs: !function utils.filter_single_letter_oracle

doc_to_text: |-
  {{text}}
doc_to_target: "{{oracle_option}}"

generation_kwargs:
  until: []

filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "Answer:\\s*([A-D](?:\\s*,\\s*[A-D])*)"
        group_select: -1

metric_list:
  - metric: !function utils.strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.loose_acc
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
  note: "SpatialMap-TQA-Corr-Single — 1038 single-letter gold rows (count 404, dir 332, which 302)"
