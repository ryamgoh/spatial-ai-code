# Exp 13 — frozen diagnostic suite. Evaluation only; never an SFT split.
task: spatial_eval_v13_diagnostic
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "../data/spatial_v13_diagnostic_test.jsonl"
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_v13_sft
doc_to_text: "{{text}}"
doc_to_target: "{{oracle_option}}"
generation_kwargs:
  until: []
filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "Answer:\\s*([A-E](?:\\s*,\\s*[A-E])*)"
        group_select: -1
metric_list:
  - metric: !function utils.strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.loose_acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  note: "Exp 13 diagnostic: semantic controls, proof depth/distractors, and global cycles with open-chain controls"
