# Exp 12 — matched 1k val (ckpt pick / overfit). Never the 2k test.
task: spatial_eval_v12_val
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "../data/spatial_sft_v12_1000_val.jsonl"
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_v6_sft
doc_to_text: "{{text}}"
doc_to_target: "{{oracle_option}}"
generation_kwargs:
  until: []
filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "Answer:\\s*([A-E](?:\\s*,\\s*[A-E])*)"
        group_select: -1
metric_list:
  - metric: !function utils.strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.loose_acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  note: "Exp 12 matched 1k val; checkpoint pick and overfit. Not the 2k test."
