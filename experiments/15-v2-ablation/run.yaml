version: 1
name: v2-trace-pilot
matrix: matrix.yaml
data_output: data/spatial_v2_pilot.jsonl
base_model: Qwen/Qwen3.5-4B

train:
  template: templates/train.yaml
  overrides:
    num_epochs: 2

eval:
  template: templates/eval.yaml
  task_template: templates/task.yaml
  overrides: {}

arms:
  - name: single-natural
    view: single__natural__checked-trace
  - name: single-symbolic
    view: single__symbolic__checked-trace
  - name: answer-only
    view: single__natural__answer-only
  - name: corrupted-symbolic
    view: single__symbolic__corrupted-trace
  - name: untuned-natural
    view: single__natural__checked-trace
    train: false
  - name: untuned-symbolic
    view: single__symbolic__checked-trace
    train: false
  - name: untuned-answer-only
    view: single__natural__answer-only
    train: false

resources:
  generate:
    partition: gpu
    gres: gpu:h200-141:1
    cpus: 8
    memory: 64G
    time: "03:00:00"
  train:
    partition: gpu
    gres: gpu:h200-141:1
    cpus: 16
    memory: 128G
    time: "03:00:00"
  eval:
    partition: gpu
    gres: gpu:h200-141:1
    cpus: 16
    memory: 128G
    time: "03:00:00"
  summarize:
    partition: gpu
    gres: gpu:h200-141:1
    cpus: 4
    memory: 16G
    time: "00:30:00"
