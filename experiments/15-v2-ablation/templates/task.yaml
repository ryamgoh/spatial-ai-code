task: __TASK_NAME__
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    test: "__TEST_PATH__"
test_split: test
output_type: generate_until
process_docs: !function utils.process_docs_v2_sft
doc_to_text: "{{text}}"
doc_to_target: "{{oracle_option}}"
generation_kwargs:
  until: []
filter_list:
  - name: extract-answer
    filter:
      - function: regex
        regex_pattern: "Answer:\\s*([A-Z](?:\\s*,\\s*[A-Z])*)"
        group_select: -1
metric_list:
  - metric: !function utils.strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: !function utils.loose_acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  note: "Spatial V2 generated heldout view"
