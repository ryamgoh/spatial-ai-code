# Exp 4b — same SFT recipe as 4a, launched via `axolotl train` (not finetune.py).
# Sized for 1x H100-47 (MIG 3g.47gb). Adapter lands at
# experiments/04b-cli/models/qwen3.5-4b-sft; merge writes adapter/merged/.
base_model: Qwen/Qwen3.5-4B
load_in_4bit: true
adapter: qlora
lora_r: 64
lora_alpha: 128
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - down_proj
  - up_proj
  - linear_attn.in_proj_qkv
  - linear_attn.in_proj_z
  - linear_attn.out_proj
lora_qkv_kernel: true
lora_o_kernel: true
lora_mlp_kernel: true
embeddings_skip_upcast: true
attn_implementation: sdpa
sample_packing: false
pad_to_sequence_len: false
learning_rate: 0.0001
sequence_len: 4096
micro_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optimizer: paged_adamw_8bit
lr_scheduler: cosine
warmup_ratio: 0.05
fp16: false
bf16: true
max_grad_norm: 0.05
num_epochs: 2
logging_steps: 1
output_dir: ../experiments/04b-cli/models/qwen3.5-4b-sft
datasets:
  - path: ../data/spatial_sft_data_all_train.jsonl
    type: chat_template
    field_messages: messages
dataloader_prefetch_factor: 8
dataloader_num_workers: 2
dataloader_pin_memory: true

val_set_size: 0.05
eval_strategy: steps
eval_steps: 10
save_steps: 10
load_best_model_at_end: true
early_stopping_patience: 1
early_stopping_threshold: 0.05
metric_for_best_model: eval_loss
greater_is_better: false
