# GRPO on merged SFT (bf16) + new LoRA. Same-node 2 GPU:
#   GPU 0: axolotl vllm-serve  GPU 1: train
# Merge QLoRA first into a sibling dir (original adapter is not modified):
#   outputs/deepseek-r1-qwen3-8b          SFT LoRA (keep)
#   outputs/deepseek-r1-qwen3-8b-merged   bf16 full model for vLLM
base_model: ../experiments/05-grpo/models/deepseek-r1-qwen3-8b-merged
load_in_4bit: false
adapter: lora
lora_r: 64
lora_alpha: 128
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - down_proj
  - up_proj
lora_qkv_kernel: false
lora_o_kernel: false
lora_mlp_kernel: false

rl: grpo
chat_template: qwen3
sample_packing: false
remove_unused_columns: false
skip_prepare_dataset: true

sequence_len: 1024
micro_batch_size: 4
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

learning_rate: 0.00001
optimizer: adamw_torch
lr_scheduler: cosine
warmup_steps: 1
bf16: true
max_grad_norm: 1.0
num_epochs: 1
max_steps: 20
logging_steps: 1
save_steps: 5
save_total_limit: 3
auto_resume_from_checkpoints: false
eval_strategy: steps
eval_steps: 5
val_set_size: 0.002
load_best_model_at_end: true
early_stopping_patience: 1
early_stopping_threshold: 0.0
metric_for_best_model: eval_loss
greater_is_better: false

output_dir: ../experiments/05-grpo/models/deepseek-r1-qwen3-8b-grpo-vllm

datasets:
  - path: ../spatial_grpo_data.jsonl
    ds_type: json
    type:

trl:
  beta: 0.04
  epsilon: 0.2
  num_generations: 4
  max_completion_length: 1536
  temperature: 0.7
  use_vllm: true
  vllm_mode: server
  vllm_lora_sync: true
  vllm_server_host: 127.0.0.1
  vllm_server_port: 8000
  vllm_server_timeout: 600
  log_completions: true
  num_completions_to_print: 2
  mask_truncated_completions: true
  reward_funcs:
    - rewards.outcome_reward
    - rewards.format_reward
    - rewards.length_penalty
  reward_weights: [1.0, 0.1, 0.1]

vllm:
  host: 0.0.0.0
  port: 8000
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.85
  dtype: auto
  max_model_len: 3072
