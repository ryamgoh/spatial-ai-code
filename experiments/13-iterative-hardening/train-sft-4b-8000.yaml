# Native V13.1 nested 8K, fresh untouched Qwen3.5-4B.
# Training strength and effective batch match the native V13 6K run.
base_model: Qwen/Qwen3.5-4B
load_in_4bit: true
adapter: qlora
lora_r: 64
lora_alpha: 128
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - down_proj
  - up_proj
  - linear_attn.in_proj_qkv
  - linear_attn.in_proj_z
  - linear_attn.out_proj
lora_qkv_kernel: false
lora_o_kernel: false
lora_mlp_kernel: false
embeddings_skip_upcast: true
attn_implementation: sdpa
sample_packing: false
pad_to_sequence_len: false
shuffle_merged_datasets: true
learning_rate: 0.00005
# Measured with the Qwen3.5 tokenizer: 769/2,000 new traces exceed 4,096
# tokens; the maximum is 7,653. Preserve complete traces instead of truncating.
sequence_len: 8192
micro_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optimizer: paged_adamw_8bit
lr_scheduler: cosine
warmup_ratio: 0.05
fp16: false
bf16: true
max_grad_norm: 0.05
num_epochs: 1
logging_steps: 1
output_dir: ../experiments/13-iterative-hardening/models/qwen3.5-4b-v13-sft-8000
datasets:
  - path: ../data/spatial_v13_sft_8000_train.jsonl
    type: chat_template
    field_messages: messages
test_datasets:
  - path: ../data/spatial_v13_sft_8000_val.jsonl
    type: chat_template
    field_messages: messages
dataloader_prefetch_factor: 8
dataloader_num_workers: 2
dataloader_pin_memory: true
dataset_num_proc: 16
val_set_size: 0
eval_strategy: steps
eval_steps: 125
save_steps: 125
save_total_limit: 4
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
